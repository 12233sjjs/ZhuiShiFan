name: Build TrollStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools dist
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o work/tools/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  work/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q work/tools/xcodegen.zip -d work/tools
          XCODEGEN=$(find work/tools -type f -name xcodegen | head -1)
          chmod +x "$XCODEGEN"
          "$XCODEGEN" generate
          xcodebuild -version
      - name: Test on iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project ZhuiShiFan.xcodeproj -scheme ZhuiShiFan -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator \
            -resultBundlePath dist/Tests.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO | tee dist/tests.log
      - name: Capture running app
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_DEVICE" -b
          xcrun simctl install "$SIM_DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/ZhuiShiFan.app
          xcrun simctl terminate "$SIM_DEVICE" com.zhuishifan.iphone || true
          xcrun simctl launch "$SIM_DEVICE" com.zhuishifan.iphone
          sleep 15
          xcrun simctl io "$SIM_DEVICE" screenshot dist/home-iphone.png
      - name: Build and package IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project ZhuiShiFan.xcodeproj -scheme ZhuiShiFan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO | tee dist/build.log
          mkdir -p work/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/ZhuiShiFan.app work/package/Payload/
          APP=work/package/Payload/ZhuiShiFan.app
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          lipo -archs "$APP/ZhuiShiFan"
          (cd work/package && zip -qry ../../dist/ZhuiShiFan-TrollStore.ipa Payload)
          shasum -a 256 dist/ZhuiShiFan-TrollStore.ipa > dist/SHA256SUMS.txt
      - name: Upload IPA and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZhuiShiFan-TrollStore
          path: dist/
          retention-days: 14
          if-no-files-found: warn
